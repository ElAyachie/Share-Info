plugins {
    id 'com.android.application'
}

// API credentials live in local.properties, which is not committed. Both are optional:
//   reddit.clientId     - Reddit app client ID; without it Reddit uses its public feed.
//   reddit.clientSecret - only for a "personal use script" Reddit app; installed apps have none.
//   youtube.apiKey   - YouTube Data API v3 key; without it YouTube is left out of reports.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Release signing. The keystore is never committed: the release workflow (and anyone building a
// signed release on their own computer) points at it with these environment variables. Without
// them the release build comes out unsigned.
def releaseKeystore = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace 'com.example.shareinfo'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.example.shareinfo"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "REDDIT_CLIENT_ID", "\"${localProperties.getProperty('reddit.clientId', '')}\""
        buildConfigField "String", "REDDIT_CLIENT_SECRET", "\"${localProperties.getProperty('reddit.clientSecret', '')}\""
        buildConfigField "String", "YOUTUBE_API_KEY", "\"${localProperties.getProperty('youtube.apiKey', '')}\""
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "release"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests {
            // The sentiment lexicon lives in assets; unit tests read it straight from disk.
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.navigation:navigation-fragment:2.9.5'
    implementation 'androidx.navigation:navigation-ui:2.9.5'
    implementation 'com.robinhood.spark:spark:1.2.0'

    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub on the JVM, so unit tests need the real implementation.
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
